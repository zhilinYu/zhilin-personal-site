<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080e15"><title>方块时间 · 志林的小游戏</title>
  <script src="theme.js"></script><link rel="stylesheet" href="../creative-space.css"><link rel="stylesheet" href="games.css">
</head>
<body class="game-page">
  <main class="play-app" data-game="tetris">
    <header class="play-topbar"><a class="play-brand" href="../../index.html" data-theme-handoff><span class="brand-mark">志</span><span>AI 实践工作台 <small>/ 小游戏</small></span></a><div class="play-actions"><label class="theme-picker"><span>主题</span><select data-theme-select aria-label="选择网站主题"><option value="tech">科技蓝</option><option value="fresh">小清新</option><option value="paper">暖白纸感</option><option value="graphite">石墨暗色</option></select></label><button class="play-button" type="button" data-fullscreen>⛶ <span>全屏</span></button></div></header>
    <section class="game-main" aria-labelledby="game-title">
      <div class="game-heading"><div><p class="section-kicker">02 / DROP</p><h1 id="game-title">方块时间</h1><p>旋转、移动、消行。让方块落进合适的位置。</p></div><div class="score-stack"><div><span>分数</span><b data-score>0</b></div><button class="play-button" type="button" data-pause aria-pressed="false">暂停</button><button class="play-button" type="button" data-restart>重新开始 ↻</button></div></div>
      <div class="tetris-stage"><div class="tetris-board-large" data-board aria-label="方块游戏棋盘"></div><aside class="tetris-info"><span>下一块</span><div class="next-piece-large" data-next></div><span>已消行</span><b data-lines>0</b><p data-status aria-live="polite">← → 移动 · ↑ 旋转 · ↓ 加速</p></aside></div>
      <div class="game-toolbar"><p>键盘方向键或屏幕按钮控制。</p><button class="play-button" type="button" data-howto>玩法说明</button></div>
      <div class="howto-panel" data-howto-panel hidden>← / → 移动，↑ 旋转，↓ 加速下落，空格直接落底。完整横行会被清除。支持屏幕方向按钮。游戏自动下落；点击“暂停”可暂时停住，点击“继续”恢复。重新开始会清空棋盘与分数。</div>
      <div class="touch-pad tetris-pad" aria-label="触屏方向控制"><button type="button" data-move="left" aria-label="向左">←</button><button type="button" data-move="rotate" aria-label="旋转">↻</button><button type="button" data-move="right" aria-label="向右">→</button><button type="button" data-move="down" aria-label="向下">↓</button><button type="button" data-move="drop" aria-label="直接落下">落下</button></div>
      <footer class="play-footer"><a href="../../index.html" data-theme-handoff>← 返回首页</a><span>独立编写的本地试玩</span></footer>
    </section>
  </main>
  <script src="games.js"></script>
</body>
</html>
