name: Deploy to VPS

on:
  push:
    branches: [main]
    paths:
      - 'payment/**'
      - 'deploy/zhilin-shop.service'
      - 'assets/checkout.js'
      - 'tests/checkout.test.cjs'
  workflow_dispatch:

concurrency:
  group: zhilin-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Build current static content
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          python3 tests/content_backup_test.py
          node tools/export.mjs

      - name: Determine payment deployment scope
        id: changes
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$RELEASE_EVENT" = "workflow_dispatch" ]; then
            node tools/deployment-scope.mjs --manual >> "$GITHUB_OUTPUT"
          else
            node tools/deployment-scope.mjs "$BEFORE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Check payment service
        run: |
          python -m pip install --only-binary=:all: -r payment/requirements.txt
          python -m unittest discover -s payment/tests -v
          node --check assets/checkout.js
          node --test tests/checkout.test.cjs

      - name: Upload release backup guard
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 106.75.250.138
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy/preflight_backup.py"
          target: "/opt/zhilin-shop/"
          strip_components: 0

      - name: Back up and verify current deployment
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 106.75.250.138
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            timeout --signal=TERM --kill-after=5s 45s /opt/zhilin-shop/venv/bin/python /opt/zhilin-shop/deploy/preflight_backup.py \
              --run-id '${{ github.run_id }}-${{ github.run_attempt }}' \
              --target-sha '${{ github.sha }}' \
              --rollback-sha '${{ github.event.before }}'

      - name: Deploy Payment Service
        if: steps.changes.outputs.payment == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 106.75.250.138
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "payment/app.py,payment/wsgi.py,payment/package_products.py,payment/list_service_orders.py,payment/requirements.txt,deploy/zhilin-shop.service"
          target: "/opt/zhilin-shop/"
          strip_components: 0

      - name: Restart Payment Service
        if: steps.changes.outputs.payment == 'true'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 106.75.250.138
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            test -f /etc/zhilin-shop/shop.env
            /opt/zhilin-shop/venv/bin/pip install --only-binary=:all: -r /opt/zhilin-shop/payment/requirements.txt
            install -m 0644 /opt/zhilin-shop/deploy/zhilin-shop.service /etc/systemd/system/zhilin-shop.service
            systemctl daemon-reload
            systemctl restart zhilin-shop
            for attempt in 1 2 3 4 5; do
              if curl --fail --silent http://127.0.0.1:9101/api/shop/status; then break; fi
              sleep 1
            done
            curl --fail --silent http://127.0.0.1:9101/api/shop/status

      - name: Deploy to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 106.75.250.138
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deployment/site/*"
          target: "/usr/share/nginx/html/"
          strip_components: 2

      - name: Reload Nginx
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 106.75.250.138
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: nginx -t && systemctl reload nginx
