name: Verify Site

on:
  push:
    branches: ['codex/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python -m pip install --only-binary=:all: -r payment/requirements.txt
      - name: Verify content and payment
        run: |
          npm test
          python -m unittest discover -s payment/tests -v
          python3 tests/content_backup_test.py
          node --check assets/checkout.js
          node tools/export.mjs
          git diff --exit-code -- index.html
