          "required": false,
          "date_format": "YYYY-MM-DD",
          "time_format": false,
          "format": "YYYY-MM-DD"
        },
        {
          "name": "tags",
          "label": "标签",
          "widget": "list",
          "required": false
        },
        {
          "name": "order",
          "label": "排序（数字越小越靠前）",
          "widget": "number",
