{
  "backend": {
    "name": "github",
    "repo": "zhilinYu/zhilin-personal-site",
    "branch": "main",
    "auth_scope": "public_repo",
    "base_url": "https://zhilin.club",
    "auth_endpoint": "cms/auth",
    "squash_merges": true
  },
  "local_backend": {
    "url": "http://127.0.0.1:8081/api/v1"
  },
  "publish_mode": "editorial_workflow",
  "locale": "zh_Hans",
  "site_url": "https://zhilin.club",
  "display_url": "https://zhilin.club",
  "logo_url": "/assets/blue-tuanzi.png",
  "media_folder": "assets/uploads",
  "public_folder": "/assets/uploads",
  "collections": [
    {
      "name": "articles",
      "label": "文章",
      "folder": "content/articles",
      "format": "json",
      "extension": "json",
      "create": true,
      "delete": true,
      "identifier_field": "id",
      "slug": "{{id}}",
      "summary": "{{title}} · {{id}}",
      "sortable_fields": [
        "order",
        "title"
      ],
      "fields": [
        {
          "name": "type",
          "label": "内容类型",
          "widget": "hidden",
          "default": "article"
        },
        {
          "name": "id",
          "label": "固定 ID（小写字母、数字、短横线；保存后请勿修改）",
          "widget": "string",
          "pattern": [
            "^[a-z0-9][a-z0-9-]{0,79}$",
            "请输入稳定的英文 ID，如 my-first-article"
          ]
        },
        {
          "name": "title",
          "label": "标题",
          "widget": "string"
        },
        {
          "name": "desc",
          "label": "摘要",
          "widget": "text"
        },
        {
          "name": "tag",
          "label": "卡片标签",
          "widget": "string",
          "required": false
        },
        {
          "name": "image",
          "label": "封面（公开图片，不超过 2 MiB）",
          "widget": "image",
          "required": false,
          "media_library": {
            "config": {
              "max_file_size": 2097152
            }
          },
          "choose_url": false
        },
        {
          "name": "date",
          "label": "日期",
          "widget": "datetime",
          "required": false,
          "date_format": "YYYY-MM-DD",
          "time_format": false,
          "format": "YYYY-MM-DD"
        },
        {
          "name": "tags",
          "label": "标签",
          "widget": "list",
          "required": false
        },
        {
          "name": "order",
          "label": "排序（数字越小越靠前）",
          "widget": "number",
          "value_type": "int",
          "default": 100,
          "min": -100000,
          "max": 100000
        },
        {
          "name": "enabled",
          "label": "在网站公开展示",
          "widget": "boolean",
          "default": false
        },
        {
          "name": "source",
          "label": "作者／来源",
          "widget": "string",
          "required": false,
          "default": "志林整理"
        },
        {
          "name": "url",
          "label": "来源或 GitHub 链接（HTTPS）",
          "widget": "string",
          "required": false
        },
        {
          "name": "license",
          "label": "许可证名称",
          "widget": "string",
          "required": false
        },
        {
          "name": "licenseUrl",
          "label": "许可证链接（HTTPS）",
          "widget": "string",
          "required": false
        },
        {
          "name": "body",
          "label": "正文／使用说明（Markdown）",
          "widget": "markdown",
          "required": false
        }
      ]
    },
    {
      "name": "prompts",
      "label": "提示词",
      "folder": "content/prompts",
      "format": "json",
      "extension": "json",
      "create": true,
      "delete": true,
      "identifier_field": "id",
      "slug": "{{id}}",
      "summary": "{{title}} · {{id}}",
      "sortable_fields": [
        "order",
        "title"
      ],
      "fields": [
        {
          "name": "type",
          "label": "内容类型",
          "widget": "select",
          "options": [
            {
              "label": "免费全文",
              "value": "open-prompt"
            },
            {
              "label": "收费公开介绍",
              "value": "paid-prompt"
            },
            {
              "label": "开源提示词链接",
              "value": "link-prompt"
            }
          ],
          "default": "open-prompt"
        },
        {
          "name": "id",
          "label": "固定 ID（小写字母、数字、短横线；保存后请勿修改）",
          "widget": "string",
          "pattern": [
            "^[a-z0-9][a-z0-9-]{0,79}$",
            "请输入稳定的英文 ID，如 my-first-article"
          ]
        },
        {
          "name": "title",
          "label": "标题",
          "widget": "string"
        },
        {
          "name": "desc",
          "label": "摘要",
          "widget": "text"
        },
        {
          "name": "tag",
          "label": "卡片标签",
          "widget": "string",
          "required": false
        },
        {
          "name": "image",
          "label": "封面（公开图片，不超过 2 MiB）",
          "widget": "image",
          "required": false,
          "media_library": {
            "config": {
              "max_file_size": 2097152
            }
          },
          "choose_url": false
        },
        {
          "name": "date",
          "label": "日期",
          "widget": "datetime",
          "required": false,
          "date_format": "YYYY-MM-DD",
          "time_format": false,
          "format": "YYYY-MM-DD"
        },
        {
          "name": "tags",
          "label": "标签",
          "widget": "list",
          "required": false
        },
        {
          "name": "order",
          "label": "排序（数字越小越靠前）",
          "widget": "number",
          "value_type": "int",
          "default": 100,
          "min": -100000,
          "max": 100000
        },
        {
          "name": "enabled",
          "label": "在网站公开展示",
          "widget": "boolean",
          "default": false
        },
        {
          "name": "source",
          "label": "作者／来源",
          "widget": "string",
          "required": false,
          "default": "志林整理"
        },
        {
          "name": "url",
          "label": "来源或 GitHub 链接（HTTPS）",
          "widget": "string",
          "required": false
        },
        {
          "name": "license",
          "label": "许可证名称",
          "widget": "string",
          "required": false
        },
        {
          "name": "licenseUrl",
          "label": "许可证链接（HTTPS）",
          "widget": "string",
          "required": false
        },
        {
          "name": "group",
          "label": "栏目分类",
          "widget": "select",
          "options": [
            {
              "label": "AI 选股研究",
              "value": "stock"
            },
            {
              "label": "创作与生图",
              "value": "community"
            }
          ],
          "default": "stock"
        },
        {
          "name": "body",
          "label": "正文／使用说明（Markdown）",
          "widget": "markdown",
          "required": false
        },
        {
          "name": "prompt",
          "label": "免费提示词全文（收费条目必须留空）",
          "widget": "text",
          "required": false
        },
        {
          "name": "price",
          "label": "公开价格（绑定支付时必须与既有价格一致，不能在此改收款金额）",
          "widget": "string",
          "required": false
        },
        {
          "name": "sku",
          "label": "既有支付商品（已绑定的不可改绑；新条目可留空咨询）",
          "widget": "select",
          "required": false,
          "options": [
            {
              "label": "量化风控 · ¥9.9",
              "value": "quant-risk"
            },
            {
              "label": "趋势龙头 · ¥9.9",
              "value": "trend-leader"
            },
            {
              "label": "游资弹性 · ¥9.9",
              "value": "hot-money"
            },
            {
              "label": "逆势抗跌 · ¥9.9",
              "value": "countertrend"
            },
            {
              "label": "涨停回吐 · ¥9.9",
              "value": "limit-up-pullback"
            },
            {
              "label": "全套研究提示词 · ¥39.9",
              "value": "research-bundle"
            }
          ]
        }
      ]
    },
    {
      "name": "skills",
      "label": "Skills",
      "folder": "content/skills",
      "format": "json",
      "extension": "json",
      "create": true,
      "delete": true,
      "identifier_field": "id",
      "slug": "{{id}}",
      "summary": "{{title}} · {{id}}",
      "sortable_fields": [
        "order",
        "title"
      ],
      "fields": [
        {
          "name": "type",
          "label": "内容类型",
          "widget": "select",
          "options": [
            {
              "label": "公开 Skill",
              "value": "skill"
            },
            {
              "label": "本地定制 Skill",
              "value": "local-skill"
            }
          ],
          "default": "skill",
          "hint": "ID 为 ashare-local 时必须保持本地定制 Skill。"
        },
        {
          "name": "id",
          "label": "固定 ID（小写字母、数字、短横线；保存后请勿修改）",
          "widget": "string",
          "pattern": [
            "^[a-z0-9][a-z0-9-]{0,79}$",
            "请输入稳定的英文 ID，如 my-first-article"
          ]
        },
        {
          "name": "title",
          "label": "标题",
          "widget": "string"
        },
        {
          "name": "desc",
          "label": "摘要",
          "widget": "text",
          "hint": "摘要会公开展示，请勿填写付费 Skill 全文。"
        },
        {
          "name": "tag",
          "label": "卡片标签",
          "widget": "string",
          "required": false
        },
        {
          "name": "image",
          "label": "封面（公开图片，不超过 2 MiB）",
          "widget": "image",
          "required": false,
          "media_library": {
            "config": {
              "max_file_size": 2097152
            }
          },
          "choose_url": false
        },
        {
          "name": "date",
          "label": "日期",
          "widget": "datetime",
          "required": false,
          "date_format": "YYYY-MM-DD",
          "time_format": false,
          "format": "YYYY-MM-DD"
        },
        {
          "name": "tags",
          "label": "标签",
          "widget": "list",
          "required": false
        },
        {
          "name": "order",
          "label": "排序（数字越小越靠前）",
          "widget": "number",
          "value_type": "int",
          "default": 100,
          "min": -100000,
          "max": 100000
        },
        {
          "name": "enabled",
          "label": "在网站公开展示",
          "widget": "boolean",
          "default": false
        },
        {
          "name": "source",
          "label": "作者／来源",
          "widget": "string",
          "required": false,
          "default": "志林整理"
        },
        {
          "name": "url",
          "label": "来源或 GitHub 链接（HTTPS）",
          "widget": "string",
          "required": false
        },
        {
          "name": "license",
          "label": "许可证名称",
          "widget": "string",
          "required": false
        },
        {
          "name": "licenseUrl",
          "label": "许可证链接（HTTPS）",
          "widget": "string",
          "required": false
        },
        {
          "name": "group",
          "label": "栏目分类",
          "widget": "select",
          "options": [
            {
              "label": "我的开源",
              "value": "own"
            },
            {
              "label": "本地定制",
              "value": "local"
            },
            {
              "label": "开源社区",
              "value": "external"
            }
          ],
          "default": "own"
        },
        {
          "name": "body",
          "label": "正文／使用说明（Markdown）",
          "widget": "markdown",
          "required": false,
          "hint": "正文会公开展示，只填写简介或使用说明，不要粘贴付费内容。"
        },
        {
          "name": "version",
          "label": "版本",
          "widget": "string",
          "required": false
        },
        {
          "name": "price",
          "label": "公开价格（付费 Skill 固定 ¥99.0）",
          "widget": "string",
          "required": false,
          "hint": "仅为显示价格；实际金额由支付服务端决定，不能在后台更改。",
          "pattern": [
            "^¥99\\.0$",
            "留空或填写 ¥99.0"
          ]
        },
        {
          "name": "sku",
          "label": "支付商品（仅用于 ID 为 ashare-local 的本地定制 Skill）",
          "widget": "select",
          "required": false,
          "options": [
            {
              "label": "A 股五策略研究助手 · ¥99",
              "value": "ashare-five-strategies"
            }
          ],
          "hint": "ashare-local 必须保留此 SKU。付费 ZIP 必须由服务端私有目录交付，不能上传公开附件。"
        },
        {
          "name": "attachment",
          "label": "公开 Skill ZIP（付费商品严禁上传；不超过 10 MiB）",
          "widget": "file",
          "required": false,
          "choose_url": false,
          "media_library": {
            "config": {
              "max_file_size": 10485760
            }
          },
          "hint": "此处上传的文件进入公开仓库。付费 Skill 包必须通过服务端私有商品目录交付。"
        }
      ]
    },
    {
      "name": "settings",
      "label": "站点设置",
      "delete": false,
      "editor": {
        "preview": false
      },
      "files": [
        {
          "name": "market",
          "label": "实时行情",
          "file": "content/settings/market.json",
          "format": "json",
          "fields": [
            {
              "name": "enabled",
              "label": "在首页显示实时行情",
              "widget": "boolean",
              "default": true
            },
            {
              "name": "quotes",
              "label": "自选列表",
              "widget": "list",
              "summary": "{{fields.name}} · {{fields.code}}",
              "max": 30,
              "hint": "代码加交易所前缀：上交所 sh、深交所 sz、北交所 bj，例如 sh600519、sz000858、sh000001（上证指数）。卡片最多 8 只。",
              "fields": [
                {
                  "name": "code",
                  "label": "代码",
                  "widget": "string",
                  "pattern": [
                    "^(sh|sz|bj)\\d{6}$",
                    "形如 sh600519"
                  ]
                },
                {
                  "name": "name",
                  "label": "显示名称",
                  "widget": "string",
                  "pattern": [
                    "^.{1,12}$",
                    "1–12 个字"
                  ]
                },
                {
                  "name": "card",
                  "label": "显示在首屏卡片",
                  "widget": "boolean",
                  "default": true
                },
                {
                  "name": "ticker",
                  "label": "显示在滚动条",
                  "widget": "boolean",
                  "default": true
                }
              ]
            }
          ]
        }
      ]
    }
  ]
}
